<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .information, .skills, .hobbies {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 100px;
            border-color: #5f717e;
            color: #4f87ae;
            background-color: #e0e0e0;
            box-sizing: border-box;
            text-align: center;
        }
        h2, h3 {
            color: #333;
        }
        ul, ol {
            margin-left: 20px;
        }
    </style>
</head>
<body>
    <div class="information">
    <h2 id="student-name">Shumail Raza Shah</h2>
    <p class="student-details">Student ID: 70174172</p>
    <p class="student-details">Department: Computer Science</p>
    </div>
    <div class="skills">
    <h3>Skills</h3>
    <ul>
    <li>Web Development</li>
    <li>Graphic Design</li>
    <li>Data Science</li>
    </ul>
    </div>
    <div class="hobbies">
    <h3>Hobbies</h3>
    <ol>
    <li>Reading</li>
    <li>Playing Video Games</li>
    <li>Watching Movies</li>
    </ol>
    </div>
</body>
</html>
